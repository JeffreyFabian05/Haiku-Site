<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Old Pond</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="haiku-container">
        <header>
            <h1>The Old Pond</h1>
            <h2>By Matsuo Bashō</h2>
        </header>
        <p class="poem">
            An old silent pond<br>
            A frog jumps into the pond—<br>
            Splash! Silence again.
        </p>
        <img class="haiku-image" src="img/AI Frog Photo.png" alt="A frog jumping into a quiet pond">
    </div>
    <!-- Georgia's traditional serif style complements the calm and reflective tone of the haiku. -->
</body>
</html>
